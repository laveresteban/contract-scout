# Background scraper for Contract Scout.
#
# Runs the `scheduler` container, which every 30 min (7am-10pm ET, Mon-Sat)
# reads your saved searches from the UI and re-scrapes each one for new jobs.
#
# It needs to reach the real scrape backend (the one that serves /search and
# /prefs/saved-searches). Point SCRAPE_API_BASE at it:
#   - Same Docker network as the backend:  http://backend:8000/api/v1  (default)
#   - Backend on your host machine:         http://host.docker.internal:8001/api/v1
#   - A deployed backend:                   https://your-host/api/v1
#
# Copy .env.example to .env and fill in SCRAPE_AUTH_TOKEN before `docker compose up`.
services:
  scheduler:
    build: ./scheduler
    image: contract-scout-scheduler
    container_name: contract-scout-scheduler
    restart: unless-stopped
    environment:
      TZ: America/New_York
      SCRAPE_API_BASE: ${SCRAPE_API_BASE:-http://backend:8000/api/v1}
      SCRAPE_AUTH_TOKEN: ${SCRAPE_AUTH_TOKEN:?set SCRAPE_AUTH_TOKEN in .env}
      SCRAPE_TIMEOUT: ${SCRAPE_TIMEOUT:-60}
      ONLY_ALERTS: ${ONLY_ALERTS:-false}
      RUN_ON_START: ${RUN_ON_START:-false}
    # If the backend runs on your host rather than in compose, this lets the
    # container reach it via host.docker.internal (needed on Linux; built-in on
    # Docker Desktop for Windows/Mac).
    extra_hosts:
      - "host.docker.internal:host-gateway"
